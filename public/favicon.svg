<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14b8a6" /> <!-- Tailwind Teal 500 -->
      <stop offset="100%" stop-color="#f43f5e" /> <!-- Tailwind Rose 500 -->
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="200" height="200" rx="40" fill="#0f172a" /> <!-- Slate 900 -->
  <g filter="url(#glow)">
    <path d="M 120,60 L 60,100 L 120,140 Z" fill="url(#grad1)" />
    <path d="M 160,60 L 100,100 L 160,140 Z" fill="url(#grad1)" />
  </g>
</svg>
